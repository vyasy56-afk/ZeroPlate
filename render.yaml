services:
  - type: web
    name: zeroplate
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      if [ ! -f "$DATABASE_PATH" ]; then
        mkdir -p "$(dirname "$DATABASE_PATH")" && cp data/zeroplate.db "$DATABASE_PATH";
      fi;
      gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 run:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_PATH
        value: /tmp/zeroplate.db
      - key: SECRET_KEY
        generateValue: true
